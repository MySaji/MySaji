name: Validate SAJI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://saji:saji@localhost:5432/saji_ci
      SAJI_TEST_DATABASE_URL: postgresql://saji:saji@localhost:5432/saji_ci
      DIRECT_URL: postgresql://saji:saji@localhost:5432/saji_ci
      AUTH_SECRET: ci-only-secret-not-for-deployment-0000000000
      NEXTAUTH_URL: http://localhost:3000
      CALLBACK_URL: http://localhost:3000
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: saji
          POSTGRES_PASSWORD: saji
          POSTGRES_DB: saji_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saji -d saji_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
