allowBuilds:
  '@google/genai': false
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  core-js: false
  esbuild: true
  prisma: true
  protobufjs: false
  sharp: true
minimumReleaseAgeExclude:
  - '@sentry/browser-utils@11.8.0'
  - '@sentry/browser@11.8.0'
  - '@sentry/bundler-plugins@11.8.0'
  - '@sentry/cloudflare@11.8.0'
  - '@sentry/core@11.8.0'
  - '@sentry/feedback@11.8.0'
  - '@sentry/nextjs@11.8.0'
  - '@sentry/node@11.8.0'
  - '@sentry/opentelemetry@11.8.0'
  - '@sentry/react@11.8.0'
  - '@sentry/replay-canvas@11.8.0'
  - '@sentry/replay@11.8.0'
  - '@sentry/server-runtime-injection@11.8.0'
  - '@sentry/server-utils@11.8.0'
  - '@sentry/vercel-edge@11.8.0'
overrides:
  '@auth/core': ^0.41.3
  baseline-browser-mapping: ^2.11.0
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  browserslist: ^4.28.7
  deepmerge-ts: ^8.0.0
  dompurify: ^3.4.16
  fast-uri: ^3.1.8
  fflate: ^0.8.3
  jspdf: ^4.2.1
  lodash: ^4.17.24
  nanoid@<3.3.18: ^3.3.18
  next-auth: 5.0.0-beta.32
  nodemailer: ^10.1.1
  postcss: ^8.5.23
  qs: ^6.16.0
  source-map-js: ^1.2.2
