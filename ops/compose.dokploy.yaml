# Selected deployment: Dokploy Compose mode, isolated staging project.
# Configure the native Dokploy domain -> app:3000 and keep Dokploy Isolated
# Deployments disabled: it attaches the proxy network to every service, including db.
# Inspect Preview Compose to confirm only app joins dokploy-network and neither service publishes ports.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  app:
    image: ${APP_IMAGE:?Set a unique staging image tag}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:?Set staging HTTPS URL}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?Use the staging saji_app credential at db:5432}
      DIRECT_URL: ${DATABASE_URL:?Use the staging saji_app credential at db:5432}
      AUTH_SECRET: ${AUTH_SECRET:?Set a staging-only secret}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${SITE_URL:?Set staging HTTPS URL}
      NEXTAUTH_URL: ${SITE_URL:?Set staging HTTPS URL}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:?Set staging HTTPS URL}
      CALLBACK_URL: ${SITE_URL:?Set staging HTTPS URL}
      CRON_SECRET: ${CRON_SECRET:?Set a staging-only secret}
      PAYMENT_METHOD_ENCRYPTION_KEY: ${PAYMENT_METHOD_ENCRYPTION_KEY:?Set staging-only encryption key}
      MPESA_ENV: sandbox
      MPESA_ENVIRONMENT: sandbox
      PAYPAL_ENVIRONMENT: sandbox
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    networks: [edge, database]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *logging
  db:
    image: ${DB_IMAGE:-postgis/postgis:17-3.5}
    environment:
      POSTGRES_DB: saji
      POSTGRES_USER: saji_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password, app_db_password]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ${SAJI_CONFIG_DIR:?Set protected staging config directory}/postgres/init.sh:/docker-entrypoint-initdb.d/20-saji.sh:ro
    networks: [database]
    restart: unless-stopped
    shm_size: 256mb
    mem_limit: 3g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U saji_owner -d saji']
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging
  scheduler:
    image: ${APP_IMAGE:?Set an immutable app image tag or digest}
    profiles: [jobs]
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set a staging-only secret}
    entrypoint: [node, /scheduler.mjs]
    volumes: ["${SAJI_CONFIG_DIR:?Set protected staging config directory}/scheduler.mjs:/scheduler.mjs:ro"]
    networks: [edge]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    logging: *logging
networks:
  edge:
  database:
    internal: true
volumes:
  postgres:
secrets:
  db_password:
    file: ${SAJI_SECRETS_DIR:?Set protected staging secrets directory}/db_password
  app_db_password:
    file: ${SAJI_SECRETS_DIR:?Set protected staging secrets directory}/app_db_password
